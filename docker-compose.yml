services:
  mathrl:
    build: .
    image: mathrl:cu118
    container_name: mathrl
    gpus: all
    shm_size: "8gb"
    stdin_open: true
    tty: true
    working_dir: /workspace
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      HF_HOME: /cache/hf
      HF_DATASETS_CACHE: /cache/hf/datasets
      TOKENIZERS_PARALLELISM: "false"
    volumes:
      - ${HOME}/MathRL/Data:/data
      - ${HOME}/MathRL/Models:/models
      - ${HOME}/.cache/huggingface:/cache/hf
      - ${HOME}/.cache/pip:/root/.cache/pip
      - ${HOME}/MathRL/Core:/workspace